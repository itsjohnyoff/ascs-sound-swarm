[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascs-sound-swarm"
version = "0.1.0"
description = "Audience smartphone acoustic array for sub-ms synchronized 2D sound localization and drone classification"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "anyio>=3.6.2",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "segno>=1.6.1",
    "cryptography>=43.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pyroomacoustics>=0.7.7",
]
ml = [
    "datasets>=3.0.0",
    "soundfile>=0.12.1",
    "huggingface-hub>=0.25.0",
    "onnxruntime>=1.19.0",
]
ggwave = [
    "ggwave>=0.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend", "backend.*", "shared", "sim", "analysis"]
namespaces = false
