<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCS Phone</title>
</head>
<body>
  <header><small>This phone is</small><div id="phoneId">…</div></header>
  <section class="state" id="state" data-tone="idle" role="status" aria-live="polite">
    <h1 id="title">Ready to join</h1>
    <p id="detail">Tap Join, then allow the microphone. Leave the screen on and the phone where it was measured.</p>
  </section>
  <main>
    <button id="join">Join</button>
    <div id="vuWrap" hidden><div class="meter-label"><span>Microphone level</span><span id="clipNote"></span></div><div class="meter"><div id="vuBar"></div></div></div>
    <div id="info"></div>
    <div id="notices"></div>
  </main>
  <script type="module" src="/src/phone/main.ts"></script>
</body>
</html>
